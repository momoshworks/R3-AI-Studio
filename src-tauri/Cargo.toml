[package]
name = "nexushub"
version = "0.1.0"
description = "NexusHub - AI-Orchestrated Software & Tool Repository Desktop App"
authors = ["NexusHub Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-fs = "2.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
futures-util = "0.3"
zip = "2.1"
dirs = "5.0"
anyhow = "1.0"
