<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e15"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Solar Ra Primary Gradient -->
    <linearGradient id="solar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cosmic AI Blue/Purple Gradient -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6"/>
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#ai-grad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- 2. Cybernetic Solar Orbit Rings -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ai-grad)" stroke-width="3" stroke-dasharray="14 12" opacity="0.45"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#solar-grad)" stroke-width="2" stroke-dasharray="6 18" opacity="0.6"/>

  <!-- Circuit Traces & Nodes -->
  <path d="M 60 256 H 130 L 160 226" stroke="url(#ai-grad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <circle cx="60" cy="256" r="5" fill="#38bdf8"/>
  <path d="M 452 256 H 382 L 352 286" stroke="url(#ai-grad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <circle cx="452" cy="256" r="5" fill="#c084fc"/>
  <path d="M 256 60 V 130 L 226 160" stroke="url(#solar-grad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <circle cx="256" cy="60" r="5" fill="#fbbf24"/>

  <!-- 3. Solar Rays of Ra (Geometric 8-Direction Radiant Spikes) -->
  <g filter="url(#glow)">
    <!-- Cardinal Spikes -->
    <path d="M 256 100 L 268 185 L 256 175 L 244 185 Z" fill="url(#solar-grad)"/>
    <path d="M 256 412 L 268 327 L 256 337 L 244 327 Z" fill="url(#solar-grad)"/>
    <path d="M 100 256 L 185 268 L 175 256 L 185 244 Z" fill="url(#solar-grad)"/>
    <path d="M 412 256 L 327 268 L 337 256 L 327 244 Z" fill="url(#solar-grad)"/>

    <!-- Diagonal Spikes -->
    <path d="M 145 145 L 210 190 L 198 198 L 190 210 Z" fill="url(#ai-grad)"/>
    <path d="M 367 145 L 322 210 L 314 198 L 302 190 Z" fill="url(#ai-grad)"/>
    <path d="M 145 367 L 190 302 L 198 314 L 210 322 Z" fill="url(#ai-grad)"/>
    <path d="M 367 367 L 302 322 L 314 314 L 322 302 Z" fill="url(#ai-grad)"/>
  </g>

  <!-- 4. Sun Disk of Ra (Glowing Core) -->
  <circle cx="256" cy="256" r="76" fill="url(#core-glow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="62" fill="#0c0e15" stroke="url(#solar-grad)" stroke-width="5"/>

  <!-- 5. Stylized Central Ra Solar Spark (4-Point Diamond Sparkle) -->
  <g filter="url(#glow)">
    <path d="M 256 205 Q 256 256 205 256 Q 256 256 256 307 Q 256 256 307 256 Q 256 256 256 205 Z" fill="url(#solar-grad)"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>

  <!-- 6. Accompanying AI Sparkle in Top-Right -->
  <path d="M 395 95 Q 395 120 420 120 Q 395 120 395 145 Q 395 120 370 120 Q 395 120 395 95 Z" fill="#38bdf8" filter="url(#glow)"/>
</svg>