<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#131314" />
    <title>Nerdo - AI Workstation &amp; Media Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#131314] text-gray-100 antialiased overflow-hidden selection:bg-blue-500 selection:text-white">
    <div id="root">
      <div id="boot-loader" style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#131314;color:#e3e3e3;font-family:'Cairo',sans-serif;user-select:none;">
        <div style="width:56px;height:56px;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(66,133,244,0.3);margin-bottom:16px;">
          <img src="/app-icon.png" style="width:100%;height:100%;object-fit:cover;" alt="Nerdo" />
        </div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-0.3px;margin-bottom:6px;background:linear-gradient(135deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Nerdo</div>
        <div style="font-size:12px;color:#8ab4f8;display:flex;align-items:center;gap:6px;">
          <span>Loading Nerdo AI Studio...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
